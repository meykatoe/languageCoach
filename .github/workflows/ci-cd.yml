name: CI/CD

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v

  backup-and-merge:
    name: Backup main and merge develop into main
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Back up current main to backup branch
        run: git push origin main:refs/heads/backup --force

      - name: Merge develop into main
        run: |
          git merge --no-ff origin/develop -m "chore(ci): 自動合併 develop 到 main"
          git push origin main
